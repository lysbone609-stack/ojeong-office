<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오정초등학교 사이버 행정실</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap');

  :root{
    --bg:#eef1f6;
    --surface:#ffffff;
    --surface-2:#f3f5f9;
    --line:#dbe1ea;
    --ink:#1b212c;
    --ink-dim:#69707d;
    --accent:#2255a4;
    --accent-soft:#e2ecfb;
    --good:#2f8a5b;
    --good-soft:#e0f3e8;
    --danger:#b8492f;
    --danger-soft:#f8e2da;
    --shadow:0 1px 2px rgba(20,26,38,.05), 0 10px 26px -16px rgba(20,26,38,.22);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10141b; --surface:#1a2029; --surface-2:#20273349;
      --surface-2:#212836; --line:#2c3444; --ink:#e6e9ee; --ink-dim:#8b93a0;
      --accent:#6fa2e8; --accent-soft:#182338; --good:#6fcf9d; --good-soft:#173226;
      --danger:#e88968; --danger-soft:#3a2019;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10141b; --surface:#1a2029; --surface-2:#212836; --line:#2c3444;
    --ink:#e6e9ee; --ink-dim:#8b93a0; --accent:#6fa2e8; --accent-soft:#182338;
    --good:#6fcf9d; --good-soft:#173226; --danger:#e88968; --danger-soft:#3a2019;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;
    padding-inline:16px;padding-block:16px;min-height:100%;font-size:14px;}
  .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding-bottom:12px;border-bottom:2px solid var(--line);}
  header.top h1{font-family:'Gowun Batang',serif;font-size:clamp(19px,2.6vw,25px);margin:0;}
  header.top .meta{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;}
  .clockwrap{text-align:right;line-height:1.3;}
  .clock-time{display:block;font-variant-numeric:tabular-nums;font-weight:900;font-size:clamp(17px,2.2vw,22px);color:var(--ink);}
  .clock-date{display:block;color:var(--ink-dim);font-size:11px;}
  .syncwrap{display:flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:12px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-dim);flex:none;}
  .sync-dot.on{background:var(--good);box-shadow:0 0 0 0 rgba(47,138,91,.5);animation:pulse 2.2s infinite;}
  @media (prefers-reduced-motion: reduce){ .sync-dot.on{animation:none;} }
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,138,91,.45);}70%{box-shadow:0 0 0 6px rgba(47,138,91,0);}100%{box-shadow:0 0 0 0 rgba(47,138,91,0);}}
  .sync-line{color:var(--ink-dim);font-size:12px;margin:10px 0 0;}

  /* 급식 / 시간표 / 다가오는 일정 (자동 동기화, 조회 전용) */
  .meal-badge{display:inline-block;background:var(--accent-soft);color:var(--accent);
    font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;margin-bottom:10px;}
  .menu-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .menu-list li{font-size:15px;font-weight:500;padding-block:7px;border-bottom:1px dashed var(--line);
    display:flex;align-items:baseline;gap:9px;}
  .menu-list li:last-child{border-bottom:none;}
  .menu-list li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-2px);}
  .cal-row{margin-top:12px;padding-top:12px;border-top:2px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;color:var(--ink-dim);font-size:12px;}
  .cal-row b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:14px;}
  .no-meal{color:var(--ink-dim);font-size:14px;padding-block:8px;}

    .week-meal-scroll{overflow-x:auto;padding-block:2px 4px;margin:0 -2px;}
    .week-meal-grid{display:grid;grid-auto-flow:column;grid-auto-columns:200px;gap:10px;min-width:min-content;}
    @media (min-width:760px){
          .week-meal-grid{grid-auto-flow:row;grid-template-columns:repeat(5,1fr);grid-auto-columns:unset;}
    }
    .meal-day{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;border:1px solid transparent;}
    .meal-day.today{border-color:var(--accent);background:var(--accent-soft);}
    .meal-day-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:6px;border-bottom:1px dashed var(--line);}
    .meal-day-head .mdw{font-weight:800;font-size:13px;}
    .meal-day.today .meal-day-head .mdw{color:var(--accent);}
    .meal-day-head .mdd{font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums;}
    .menu-list-sm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
    .menu-list-sm li{font-size:12.5px;font-weight:500;line-height:1.35;}
    .nutri-wrap{display:flex;align-items:center;gap:10px;margin-top:2px;}
    .nutri-donut{flex:none;transform:rotate(-90deg);}
    .seg-carb{stroke:var(--accent);}
    .seg-protein{stroke:var(--good);}
    .seg-fat{stroke:var(--danger);}
    .nutri-legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;}
    .nl{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-dim);white-space:nowrap;}
    .nl span{white-space:nowrap;}
    .nl::before{content:'';width:7px;height:7px;border-radius:50%;flex:none;}
    .nl.carb::before{background:var(--accent);}
    .nl.protein::before{background:var(--good);}
    .nl.fat::before{background:var(--danger);}
    .nl b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto;}
    .no-nutri{font-size:11px;color:var(--ink-dim);}

    .meal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
    .meal-toggle{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);flex:none;}
    .meal-toggle button{font:inherit;font-weight:700;font-size:12px;color:var(--ink-dim);background:transparent;border:none;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;}
    .meal-toggle button.active{background:var(--accent);color:#fff;}
    .meal-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .meal-nav button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;}
    .meal-nav button:hover{border-color:var(--accent);color:var(--accent);}
    .meal-nav .range{font-weight:700;font-size:13px;min-width:96px;text-align:center;}
    .meal-loading{color:var(--ink-dim);font-size:12px;margin:0 0 10px;}

    .meal-month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:640px;}
    .meal-month-cell{background:var(--surface-2);border-radius:8px;padding:6px;min-height:64px;display:flex;flex-direction:column;gap:3px;}
    .meal-month-cell.otherMonth{opacity:.42;}
    .meal-month-cell.today{box-shadow:inset 0 0 0 2px var(--accent);}
    .meal-month-cell .mdnum{font-size:11px;font-weight:700;color:var(--ink-dim);}
    .meal-month-cell .mdnum.sun{color:var(--danger);}
    .meal-month-cell .mdnum.sat{color:var(--accent);}
    .meal-month-cell.today .mdnum{color:var(--accent);}
    .meal-month-cell.has-meal{cursor:pointer;}
    .meal-month-cell.has-meal:hover{background:var(--accent-soft);}
    .meal-month-cell .mcal{font-size:10.5px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
    .meal-month-cell .mmenu{font-size:10px;color:var(--ink-dim);line-height:1.35;white-space:normal;word-break:keep-all;}
    .meal-month-cell .mmenu div{overflow-wrap:break-word;}

    /* 공용 모달 (수정 잠금 팝업 / 급식 상세 팝업) */
    .modal-overlay{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.42);display:flex;align-items:center;justify-content:center;padding:20px;}
    .modal-card{box-sizing:border-box;width:min(420px,100%);max-height:min(80vh,640px);overflow:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:20px;}
    .modal-card h3{margin:0 0 6px;font-size:16px;}
    .modal-card .modal-desc{color:var(--ink-dim);font-size:12px;margin:0 0 14px;}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
    .modal-actions button{font:inherit;font-weight:700;font-size:13px;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);}
    .modal-actions button.primary{border-color:var(--accent);background:var(--accent);color:#fff;}

    .editlock-input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:16px;letter-spacing:.1em;padding:10px 12px;margin-bottom:8px;}
    .editlock-input:focus{outline:none;border-color:var(--accent);}
    .editlock-error{color:var(--danger);font-size:12px;margin:-2px 0 10px;display:none;}
    .editlock-remember{display:flex;align-items:center;gap:7px;color:var(--ink-dim);font-size:12px;cursor:pointer;}
    .editlock-remember input{margin:0;}

  .tt-selects{display:flex;gap:8px;margin-bottom:12px;}
  .tt-selects select{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    padding:7px 9px;flex:1;min-width:0;}
  .tt-periods{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .tt-periods li{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:10px;padding:9px 11px;}
  .pnum{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent);background:var(--accent-soft);
    border-radius:8px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;}
  .psub{font-size:14px;font-weight:600;}
  .tt-empty{color:var(--ink-dim);font-size:13px;padding-block:8px;}

  .sched-scroll{display:flex;gap:10px;overflow-x:auto;padding-block:2px 4px;}
  .sched-chip{flex:none;width:130px;background:var(--surface-2);border-radius:12px;padding:11px;
    display:flex;flex-direction:column;gap:5px;}
  .sched-chip .dday{align-self:flex-start;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;
    background:var(--good-soft);color:var(--good);}
  .sched-chip.urgent .dday{background:var(--danger-soft);color:var(--danger);}
  .sched-chip .d{font-variant-numeric:tabular-nums;color:var(--ink-dim);font-size:11px;}
  .sched-chip .n{font-weight:700;font-size:13px;line-height:1.3;}

  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  nav.tabs button{
    flex:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-dim);
    background:var(--surface);border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;cursor:pointer;white-space:nowrap;
  }
  nav.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  section.panel{display:none;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);padding:16px;}
  section.panel.active{display:block;}
  section.panel h2{margin:0 0 4px;font-size:16px;font-weight:700;}
  section.panel .desc{color:var(--ink-dim);font-size:12px;margin:0 0 12px;}

  .tablewrap{overflow-x:auto;}
  table.datagrid{width:100%;border-collapse:collapse;font-size:13px;}
  table.datagrid th{
    background:var(--surface-2);color:var(--ink-dim);font-weight:700;font-size:11px;
    text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:8px 8px;
    border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;
  }
  table.datagrid td{border-bottom:1px solid var(--line);padding:2px;vertical-align:top;}
  table.datagrid tr:hover td{background:var(--surface-2);}
  table.datagrid input, table.datagrid textarea{
    width:100%;border:1px solid transparent;background:transparent;color:var(--ink);
    font:inherit;padding:6px 6px;border-radius:6px;resize:vertical;
  }
  table.datagrid input:hover, table.datagrid textarea:hover{border-color:var(--line);}
  table.datagrid input:focus, table.datagrid textarea:focus{
    outline:none;border-color:var(--accent);background:var(--surface);
  }
  .rowdel{
    border:none;background:transparent;color:var(--ink-dim);cursor:pointer;font-size:15px;
    padding:4px 8px;border-radius:6px;
  }
  .rowdel:hover{background:var(--danger-soft);color:var(--danger);}
  .addrow{
    margin-top:10px;font:inherit;font-weight:700;font-size:12px;color:var(--good);
    background:var(--good-soft);border:1px solid transparent;border-radius:8px;
    padding:7px 12px;cursor:pointer;
  }
  .addrow:hover{filter:brightness(0.96);}
  .note-area{margin-top:12px;}
  .note-area label{display:block;font-size:11px;font-weight:700;color:var(--ink-dim);
    text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
  .note-area textarea{
    width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);
    color:var(--ink);font:inherit;padding:8px 10px;resize:vertical;
  }
  .note-area textarea:focus{outline:none;border-color:var(--accent);}

  /* staff schedule (month calendar) */
  .monthnav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .monthnav button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;}
  .monthnav button:hover{border-color:var(--accent);color:var(--accent);}
  .monthnav .range{font-weight:700;font-size:14px;min-width:84px;text-align:center;}
  .calwrap{overflow-x:auto;padding-bottom:4px;}
  .dowrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;min-width:640px;}
  .dowrow span{text-align:center;font-size:11px;font-weight:700;color:var(--ink-dim);}
  .dowrow span.sun{color:var(--danger);}
  .dowrow span.sat{color:var(--accent);}
  .monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:640px;}
  .daycell{background:var(--surface-2);border-radius:8px;padding:6px;min-height:78px;
    display:flex;flex-direction:column;gap:3px;}
  .daycell.otherMonth{opacity:.42;}
  .daycell.today{box-shadow:inset 0 0 0 2px var(--accent);}
  .daycell .dnum{font-size:11px;font-weight:700;color:var(--ink-dim);}
  .daycell .dnum.sun{color:var(--danger);}
  .daycell .dnum.sat{color:var(--accent);}
  .daycell.today .dnum{color:var(--accent);}
  .entry{background:var(--surface);border:1px solid var(--line);border-radius:6px;
    padding:3px 5px;font-size:11px;display:flex;align-items:center;gap:3px;}
  .entry input{border:none;background:transparent;color:var(--ink);font:inherit;flex:1;min-width:0;padding:0;font-size:11px;}
  .entry input:focus{outline:none;}
  .entry button{border:none;background:transparent;color:var(--ink-dim);cursor:pointer;font-size:11px;flex:none;padding:0;}
  .entry button:hover{color:var(--danger);}
  .entry.synced{background:var(--accent-soft);border:1px dashed var(--accent);color:var(--accent);}
  .entry.synced .sync-tag{flex:none;}
  .duty-sync-line{color:var(--ink-dim);font-size:12px;margin:12px 0 0;}
  .daycell .addentry{font:inherit;font-size:10px;font-weight:700;color:var(--good);background:transparent;
    border:1px dashed var(--good);border-radius:6px;padding:2px;cursor:pointer;margin-top:auto;}

  /* periods */
  .periodgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
  .periodgroup{background:var(--surface-2);border-radius:10px;padding:12px;}
  .periodgroup h3{margin:0 0 8px;font-size:13px;}

  /* classroom map */
  .mapbox{display:flex;flex-direction:column;gap:10px;align-items:flex-start;}
  .mapbox img{max-width:100%;border-radius:10px;border:1px solid var(--line);}
  .uploadbtn{font:inherit;font-weight:700;font-size:12px;color:var(--accent);background:var(--accent-soft);
    border:none;border-radius:8px;padding:8px 14px;cursor:pointer;}
  .uploadbtn:hover{filter:brightness(0.97);}
  .placeholder{color:var(--ink-dim);font-size:13px;background:var(--surface-2);border-radius:10px;padding:16px;}

  footer.foot{color:var(--ink-dim);font-size:11px;text-align:center;}
  .setup-banner{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 14px;
    font-size:12px;font-weight:600;margin-bottom:12px;display:none;}
  .setup-banner.show{display:block;}
</style>
</head>
<body>

<div class="setup-banner" id="setupBanner">⚠️ 아직 Firebase 설정이 안 되어 있어요 — 이 화면은 지금 예시 데이터만 보여주고 있고, 수정 내용은 저장되지 않습니다. 함께 보내드린 설정 가이드를 따라 firebaseConfig 값을 채워주세요.</div>

<div class="wrap">
  <header class="top">
    <h1>오정초등학교 사이버 행정실</h1>
    <div class="meta">
      <div class="clockwrap">
        <span class="clock-time" id="clockTime">--:--</span>
        <span class="clock-date" id="clockDate">날짜 불러오는 중…</span>
      </div>
      <div class="syncwrap"><span class="sync-dot" id="syncDot"></span><span id="syncText">동기화 대기 중</span></div>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div id="panels"></div>

  <footer class="foot">표 탭은 이 링크를 열어본 분들이 함께 실시간으로 수정할 수 있습니다(셀을 클릭해 바로 편집) · 이 링크를 아는 사람은 누구나 로그인 없이 보고 고칠 수 있으니, 외부에 함부로 공유하지 마세요</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

<script>
(function(){
"use strict";

/* ---------------- section configs & seed data ---------------- */

var SECTIONS = [
  { key:"meal", title:"이번 주 급식", icon:"🍚", kind:"meal" },
  { key:"timetable", title:"시간표", icon:"🕘", kind:"timetable" },
  { key:"upcoming", title:"다가오는 일정", icon:"📅", kind:"upcoming" },
  { key:"schedule", title:"직원 일정표", icon:"🗓️", kind:"schedule" },
  { key:"vendors_regular", title:"정기용역", icon:"🔧", kind:"table",
    columns:[["seq","순번","48px"],["name","상호(사업자번호)","220px"],["item","건명","220px"],["phone","전화번호","190px"],["note","비고","220px"]],
    seed:[
      ["1","나래엔시스 (130-35-53872)","디지털복합기 및 프린터 임대","032-666-7900 최창권:010-4573-7512","2024.3.1~2027.02.28(3년약정) 유치원 2025.3.1~2028.2.28"],

var EDIT_PASSWORD = "1932";
var EDIT_UNLOCK_KEY = "ojeong_edit_unlocked";
var editUnlockedSession = false;

function isEditUnlocked(){
  if (editUnlockedSession) return true;
  try { return localStorage.getItem(EDIT_UNLOCK_KEY) === "1"; } catch(e){ return false; }
}

function showEditLockModal(){
  if (document.getElementById("editlockOverlay")) return;
  var overlay = document.createElement("div");
  overlay.id = "editlockOverlay";
  overlay.className = "modal-overlay";
  overlay.innerHTML =
    '<div class="modal-card" role="dialog" aria-modal="true">' +
      '<h3>🔒 수정하려면 비밀번호를 입력하세요</h3>' +
      '<p class="modal-desc">내용을 고치거나 추가·삭제하려면 비밀번호가 필요합니다.</p>' +
      '<input type="password" class="editlock-input" id="editlockInput" placeholder="비밀번호" inputmode="numeric" autocomplete="off">' +
      '<div class="editlock-error" id="editlockError">비밀번호가 올바르지 않습니다.</div>' +
      '<label class="editlock-remember"><input type="checkbox" id="editlockRemember"> 이 컴퓨터에서는 더 이상 팝업 창 뜨지 않음</label>' +
      '<div class="modal-actions">' +
        '<button type="button" id="editlockCancel">취소</button>' +
        '<button type="button" class="primary" id="editlockConfirm">확인</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);

  var input = overlay.querySelector("#editlockInput");
  var errorEl = overlay.querySelector("#editlockError");

  function close(){ overlay.remove(); }
  function tryUnlock(){
    if (input.value === EDIT_PASSWORD){
      editUnlockedSession = true;
      if (overlay.querySelector("#editlockRemember").checked){
        try { localStorage.setItem(EDIT_UNLOCK_KEY, "1"); } catch(e){ /* ignore */ }
      }
      close();
    } else {
      errorEl.style.display = "block";
      input.value = "";
      input.focus();
    }
  }

  overlay.querySelector("#editlockCancel").addEventListener("click", close);
  overlay.querySelector("#editlockConfirm").addEventListener("click", tryUnlock);
  input.addEventListener("keydown", function(e){ if (e.key === "Enter") tryUnlock(); });
  overlay.addEventListener("mousedown", function(e){ if (e.target === overlay) close(); });
  setTimeout(function(){ input.focus(); }, 30);
}

var EDIT_ACTION_SELECTOR = ".rowdel, .addrow, .addentry, .uploadbtn, [data-deldate]";

document.addEventListener("focus", function(e){
  var t = e.target;
  if (!t || (t.tagName !== "INPUT" && t.tagName !== "TEXTAREA")) return;
  var panelsHost = document.getElementById("panels");
  if (!panelsHost || !panelsHost.contains(t)) return;
  if (isEditUnlocked()) return;
  t.blur();
  showEditLockModal();
}, true);

document.addEventListener("click", function(e){
  var target = e.target && e.target.closest ? e.target.closest(EDIT_ACTION_SELECTOR) : null;
  if (!target) return;
  var panelsHost = document.getElementById("panels");
  if (!panelsHost || !panelsHost.contains(target)) return;
  if (isEditUnlocked()) return;
  e.preventDefault();
  e.stopPropagation();
  showEditLockModal();
}, true);

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function debounce(fn, ms){
  var t;
  return function(){
    var args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(ctx, args); }, ms);
  };
}

function safeJsonParse(text){
  try { return JSON.parse(text); } catch(e){ return null; }
}

function rowsFromSeed(cols, seed){
  return seed.map(function(arr){
    var o = {};
    cols.forEach(function(c, i){ o[c[0]] = arr[i] || ""; });
    return o;
  });
}

function safeGet(key){ try { return localStorage.getItem(key); } catch(e){ return null; } }
function safeSet(key, val){ try { localStorage.setItem(key, val); } catch(e){ /* ignore */ } }

function daysBetween(dateStr){
  var target = new Date(dateStr + "T00:00:00");
  var today = new Date();
  today.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
}

function formatUpdated(iso){
  try{
    var d = new Date(iso);
    var h = String(d.getHours()).padStart(2,"0");
    var m = String(d.getMinutes()).padStart(2,"0");
    return (d.getMonth()+1)+"."+d.getDate()+". "+h+":"+m;
  }catch(e){ return ""; }
}

function syncLineHtml(data){
  var upd = data && data.updatedAt ? formatUpdated(data.updatedAt) : "";
  return '<p class="sync-line">🔄 나이스에서 평일 아침마다 자동으로 갱신돼요 · 마지막 자동 갱신: '+
    (upd ? escapeHtml(upd) : "확인 중…") + '</p>';
}

function subscribeStatusDoc(handler){
  if (!db) return;
  var unsub = db.doc("status/latest").onSnapshot(function(snap){
    if (snap.exists){
      var d = snap.data();
      if (d) handler(d);
    }
  }, function(){ /* ignore */ });
  unsubs.push(unsub);
}

function buildTabs(){
  var nav = document.getElementById("tabs");
  nav.innerHTML = SECTIONS.map(function(s){
    return '<button data-key="'+s.key+'" class="'+(s.key===activeKey?'active':'')+'">'+s.icon+' '+escapeHtml(s.title)+'</button>';
  }).join("");
  Array.prototype.forEach.call(nav.querySelectorAll("button"), function(btn){
    btn.addEventListener("click", function(){ setActive(btn.getAttribute("data-key")); });
  });
}

function setActive(key){
  activeKey = key;
  Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"), function(b){
    b.classList.toggle("active", b.getAttribute("data-key") === key);
  });
  Array.prototype.forEach.call(document.querySelectorAll("section.panel"), function(p){
    p.classList.toggle("active", p.id === "panel-" + key);
  });
}

function buildPanels(){
  var host = document.getElementById("panels");
  host.innerHTML = SECTIONS.map(function(s){
    return '<section class="panel'+(s.key===activeKey?' active':'')+'" id="panel-'+s.key+'"></section>';
  }).join("");
  SECTIONS.forEach(function(s){
    var panel = document.getElementById("panel-" + s.key);
    if (s.kind === "table") renderTableSection(panel, s);
    else if (s.kind === "schedule") renderScheduleSection(panel, s);
    else if (s.kind === "periods") renderPeriodsSection(panel, s);
    else if (s.kind === "map") renderMapSection(panel, s);
    else if (s.kind === "meal") renderMealSection(panel, s);
    else if (s.kind === "timetable") renderTimetableSection(panel, s);
    else if (s.kind === "upcoming") renderUpcomingSection(panel, s);
  });
}

/* ---- 이번 주 급식 (나이스 자동 갱신, 조회 전용) : 요일별 칼로리 + 영양소 원 다이어그램 ---- */
  var MEAL_WEEKDAY_KO = ['일','월','화','수','목','금','토'];

  function donutSvg(n){
      var carbs = n ? Number(n.carbs)||0 : 0;
      var protein = n ? Number(n.protein)||0 : 0;
      var fat = n ? Number(n.fat)||0 : 0;
      var total = carbs + protein + fat;
      if (!n || total <= 0) return '<div class="no-nutri">영양정보 없음</div>';
      var r = 15.9155, circ = 2 * Math.PI * r;
      var parts = [["carb",carbs],["protein",protein],["fat",fat]];
      var acc = 0;
      var circles = parts.map(function(p){
            var pct = p[1] / total * 100;
            var dash = (pct / 100 * circ).toFixed(2) + ' ' + circ.toFixed(2);
            var dashoffset = (-acc / 100 * circ).toFixed(2);
            acc += pct;
            return '<circle class="seg-'+p[0]+'" cx="18" cy="18" r="'+r+'" fill="none" stroke-width="5" stroke-dasharray="'+dash+'" stroke-dashoffset="'+dashoffset+'"/>';
      }).join("");
      return '<svg class="nutri-donut" viewBox="0 0 36 36" width="70" height="70" aria-hidden="true">'+circles+'</svg>';
  }

  function nutriLegendHtml(n){
      if (!n) return "";
      var carbs = Number(n.carbs)||0, protein = Number(n.protein)||0, fat = Number(n.fat)||0;
      if (carbs+protein+fat <= 0) return "";
      return '<ul class="nutri-legend">' +
            '<li class="nl carb"><span>탄수화물</span><b>'+carbs.toFixed(1)+'g</b></li>' +
            '<li class="nl protein"><span>단백질</span><b>'+protein.toFixed(1)+'g</b></li>' +
            '<li class="nl fat"><span>지방</span><b>'+fat.toFixed(1)+'g</b></li>' +
          '</ul>';
  }

  function dayCardHtml(day, isToday){
      var body;
      if (day.hasMeal && day.menu && day.menu.length){
            body = '<ul class="menu-list-sm">' + day.menu.map(function(m){ return '<li>'+escapeHtml(m)+'</li>'; }).join("") + '</ul>' +
                    (day.calorie ? '<div class="cal-row"><span>열량</span><b>'+escapeHtml(day.calorie)+'</b></div>' : "") +
                    '<div class="nutri-wrap">' + donutSvg(day.nutrients) + nutriLegendHtml(day.nutrients) + '</div>';
      } else {
            body = '<div class="no-meal">급식 없음</div>';
      }
      return '<div class="meal-day'+(isToday?' today':'')+'">' +
            '<div class="meal-day-head"><span class="mdw">'+escapeHtml(day.weekday)+'요일</span><span class="mdd">'+escapeHtml(day.shortDate)+'</span></div>' +
            body +
          '</div>';
  }

  /* 급식 상세 팝업 (월간보기에서 날짜를 누르면 그날 메뉴 전체를 보여줌) */
  function showMealDetailModal(day){
      var existing = document.getElementById("mealDetailOverlay");
      if (existing) existing.remove();

      var overlay = document.createElement("div");
      overlay.id = "mealDetailOverlay";
      overlay.className = "modal-overlay";

      var body;
      if (day.hasMeal && day.menu && day.menu.length){
            body = '<ul class="menu-list">' + day.menu.map(function(m){ return '<li>'+escapeHtml(m)+'</li>'; }).join("") + '</ul>' +
                  (day.calorie ? '<div class="cal-row"><span>열량</span><b>'+escapeHtml(day.calorie)+'</b></div>' : "") +
                  '<div class="nutri-wrap">' + donutSvg(day.nutrients) + nutriLegendHtml(day.nutrients) + '</div>';
      } else {
            body = '<div class="no-meal">급식 정보가 없습니다.</div>';
      }

      overlay.innerHTML =
            '<div class="modal-card" role="dialog" aria-modal="true">' +
                  '<h3>'+escapeHtml(day.dateLabel || day.date)+'</h3>' +
                  body +
                  '<div class="modal-actions"><button type="button" class="primary" id="mealDetailClose">닫기</button></div>' +
            '</div>';
      document.body.appendChild(overlay);

      function close(){ overlay.remove(); }
      overlay.querySelector("#mealDetailClose").addEventListener("click", close);
      overlay.addEventListener("mousedown", function(e){ if (e.target === overlay) close(); });
  }

  /* 이번 주 급식(나이스 자동 갱신) — 주간/월간 전환, 이전·다음 주/달 탐색 가능.
     각 날짜의 실제 급식 데이터는 Cloud Function이 매일 status/meals_YYYY-MM 문서에 저장해둔 것을 구독해서 씀. */
  function renderMealSection(panel, cfg){
      var todayDate = new Date();
      var mode = "week"; // "week" | "month"

      function startOfWeek(d){
            var day = d.getDay();
            var diff = (day === 0) ? -6 : (1 - day);
            return new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
      }
      function isoOf(d){
            return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      }
      function monthKeyOf(y, m){ return y + "-" + String(m+1).padStart(2,"0"); } // m: 0-indexed

      var weekStart = startOfWeek(todayDate);
      var viewYear = todayDate.getFullYear();
      var viewMonth = todayDate.getMonth(); // 0-indexed (월간보기용)

      var mealsCache = {}; // monthKey -> { byDate: {"YYYY-MM-DD": {name,menu,calorie,nutrients}} }
      var mealsSubs = {};

      function ensureMonthSub(monthKey){
            if (mealsSubs[monthKey] || !db) return;
            mealsSubs[monthKey] = db.doc("status/meals_" + monthKey).onSnapshot(function(snap){
                  if (snap.exists){
                        var d = snap.data();
                        var parsed = d && typeof d.daysJson === "string" ? safeJsonParse(d.daysJson) : null;
                        mealsCache[monthKey] = { byDate: parsed || {} };
                  } else {
                        mealsCache[monthKey] = { byDate: {} };
                  }
                  paint();
            }, function(){ mealsCache[monthKey] = { byDate: {} }; paint(); });
            unsubs.push(mealsSubs[monthKey]);
      }

      function getDayEntry(iso){
            var mk = iso.slice(0, 7);
            ensureMonthSub(mk);
            var cached = mealsCache[mk];
            if (!cached) return { loading: true };
            var entry = cached.byDate[iso];
            if (!entry) return { loading: false, hasMeal: false };
            return { loading: false, hasMeal: true, name: entry.name, menu: entry.menu, calorie: entry.calorie, nutrients: entry.nutrients };
      }

      function toggleHtml(){
            return '<div class="meal-toggle">' +
                  '<button type="button" data-mode="week" class="'+(mode==="week"?"active":"")+'">주간</button>' +
                  '<button type="button" data-mode="month" class="'+(mode==="month"?"active":"")+'">월간</button>' +
                '</div>';
      }

      function bindCommon(){
            panel.querySelectorAll(".meal-toggle button").forEach(function(btn){
                  btn.addEventListener("click", function(){
                        var newMode = btn.getAttribute("data-mode");
                        if (newMode === mode) return;
                        mode = newMode;
                        paint();
                  });
            });
      }

      function paintWeek(){
            var days = [];
            var loadingAny = false;
            for (var i = 0; i < 5; i++){
                  var d = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + i);
                  var iso = isoOf(d);
                  var entry = getDayEntry(iso);
                  if (entry.loading) loadingAny = true;
                  days.push({
                        date: iso,
                        weekday: MEAL_WEEKDAY_KO[d.getDay()],
                        shortDate: (d.getMonth()+1) + "/" + d.getDate(),
                        hasMeal: !!entry.hasMeal,
                        name: entry.name || null,
                        menu: entry.menu || [],
                        calorie: entry.calorie || "",
                        nutrients: entry.nutrients || null
                  });
            }
            var todayIso = isoOf(todayDate);
            var cards = days.map(function(day){ return dayCardHtml(day, day.date === todayIso); }).join("");
            var rangeLabel = days[0].shortDate + " ~ " + days[4].shortDate;

            panel.innerHTML =
                  '<h2>'+cfg.icon+' '+escapeHtml(cfg.title)+'</h2>' +
                  '<p class="desc">월~금 급식 · 주간·월간으로 지난 주(달)·다음 주(달)까지 둘러볼 수 있어요</p>' +
                  '<div class="meal-toolbar">' + toggleHtml() +
                        '<div class="meal-nav">' +
                              '<button type="button" id="mealPrev">‹ 이전 주</button>' +
                              '<span class="range">'+escapeHtml(rangeLabel)+'</span>' +
                              '<button type="button" id="mealToday">이번 주</button>' +
                              '<button type="button" id="mealNext">다음 주 ›</button>' +
                        '</div>' +
                  '</div>' +
                  (loadingAny ? '<p class="meal-loading">급식 정보를 불러오는 중…</p>' : "") +
                  '<div class="week-meal-scroll"><div class="week-meal-grid">' + cards + '</div></div>';

            bindCommon();
            panel.querySelector("#mealPrev").addEventListener("click", function(){
                  weekStart = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() - 7);
                  paint();
            });
            panel.querySelector("#mealNext").addEventListener("click", function(){
                  weekStart = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + 7);
                  paint();
            });
            panel.querySelector("#mealToday").addEventListener("click", function(){
                  weekStart = startOfWeek(new Date());
                  paint();
            });
      }

      function paintMonth(){
            var monthKey = monthKeyOf(viewYear, viewMonth);
            ensureMonthSub(monthKey);
            var cached = mealsCache[monthKey];
            var loading = !cached;

            var firstOfMonth = new Date(viewYear, viewMonth, 1);
            var startDow = firstOfMonth.getDay();
            var gridStart = new Date(viewYear, viewMonth, 1 - startDow);
            var lastOfMonth = new Date(viewYear, viewMonth + 1, 0);
            var endDow = lastOfMonth.getDay();
            var gridEnd = new Date(viewYear, viewMonth, lastOfMonth.getDate() + (6 - endDow));
            var totalDays = Math.round((gridEnd - gridStart) / 86400000) + 1;
            var todayIso = isoOf(todayDate);

            var dowHtml = ["일","월","화","수","목","금","토"].map(function(n, i){
                  var cls = i === 0 ? "sun" : (i === 6 ? "sat" : "");
                  return '<span class="'+cls+'">'+n+'</span>';
            }).join("");

            var dayMeta = {}; // iso -> 상세 팝업에 넘길 day 객체
            var cellsHtml = "";
            for (var i = 0; i < totalDays; i++){
                  var d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
                  var iso = isoOf(d);
                  var inMonth = d.getMonth() === viewMonth;
                  var dow = d.getDay();
                  var numCls = dow === 0 ? "sun" : (dow === 6 ? "sat" : "");
                  var entry = (inMonth && cached) ? (cached.byDate[iso] || null) : null;
                  var hasMeal = !!(entry && entry.menu && entry.menu.length);
                  var dayObj = {
                        date: iso,
                        dateLabel: d.getFullYear() + "년 " + (d.getMonth()+1) + "월 " + d.getDate() + "일",
                        hasMeal: hasMeal,
                        name: entry ? entry.name : null,
                        menu: entry ? entry.menu : [],
                        calorie: entry ? entry.calorie : "",
                        nutrients: entry ? entry.nutrients : null
                  };
                  if (inMonth) dayMeta[iso] = dayObj;

                  var innerHtml = '<div class="mdnum '+numCls+'">'+d.getDate()+'</div>';
                  if (inMonth && hasMeal){
                        innerHtml += '<div class="mmenu">'+dayObj.menu.map(function(m){ return '<div>'+escapeHtml(m)+'</div>'; }).join("")+'</div>';
                  } else if (inMonth && cached){
                        innerHtml += '<div class="mmenu">급식 없음</div>';
                  }
                  cellsHtml += '<div class="meal-month-cell'+(inMonth?'':' otherMonth')+(iso===todayIso?' today':'')+(inMonth && hasMeal?' has-meal':'')+'" data-iso="'+iso+'">'+innerHtml+'</div>';
            }

            var rangeLabel = viewYear + "년 " + (viewMonth+1) + "월";

            panel.innerHTML =
                  '<h2>'+cfg.icon+' '+escapeHtml(cfg.title)+'</h2>' +
                  '<p class="desc">월별 급식 한눈에 보기 · 날짜를 누르면 메뉴 상세를 볼 수 있어요</p>' +
                  '<div class="meal-toolbar">' + toggleHtml() +
                        '<div class="meal-nav">' +
                              '<button type="button" id="mealPrev">‹ 이전 달</button>' +
                              '<span class="range">'+escapeHtml(rangeLabel)+'</span>' +
                              '<button type="button" id="mealToday">이번 달</button>' +
                              '<button type="button" id="mealNext">다음 달 ›</button>' +
                        '</div>' +
                  '</div>' +
                  (loading ? '<p class="meal-loading">급식 정보를 불러오는 중…</p>' : "") +
                  '<div class="calwrap"><div class="dowrow">'+dowHtml+'</div><div class="meal-month-grid">'+cellsHtml+'</div></div>';

            bindCommon();
            panel.querySelector("#mealPrev").addEventListener("click", function(){
                  viewMonth--; if (viewMonth < 0){ viewMonth = 11; viewYear--; } paint();
            });
            panel.querySelector("#mealNext").addEventListener("click", function(){
                  viewMonth++; if (viewMonth > 11){ viewMonth = 0; viewYear++; } paint();
            });
            panel.querySelector("#mealToday").addEventListener("click", function(){
                  var t = new Date(); viewYear = t.getFullYear(); viewMonth = t.getMonth(); paint();
            });
            panel.querySelectorAll(".meal-month-cell.has-meal").forEach(function(cell){
                  cell.addEventListener("click", function(){
                        var iso = cell.getAttribute("data-iso");
                        if (dayMeta[iso]) showMealDetailModal(dayMeta[iso]);
                  });
            });
      }

      function paint(){
            if (mode === "week") paintWeek(); else paintMonth();
      }

      paint();
  }

/* ---- 시간표 (전체 학년/반 선택, 나이스 자동 갱신) ---- */
function renderTimetableSection(panel, cfg){
  var data = STATUS_SEED;

  function paint(){
    var grades = Object.keys(data.classList || {}).sort(function(a,b){ return a - b; });
    var savedGrade = safeGet("ojeong_grade");
    var grade = (savedGrade && data.classList[savedGrade]) ? savedGrade : grades[0];
    var classes = data.classList[grade] || [1];
    var savedClass = safeGet("ojeong_class");
    var klass = (savedClass && classes.indexOf(Number(savedClass)) > -1) ? savedClass : String(classes[0]);

    var periods = data.timetable ? data.timetable[grade + "-" + klass] : null;
    var periodsHtml = (periods && periods.length)
      ? periods.map(function(subj, i){ return '<li><span class="pnum">'+(i+1)+'</span><span class="psub">'+escapeHtml(subj)+'</span></li>'; }).join("")
      : '<li class="tt-empty">이 날짜의 시간표 정보가 없습니다 (휴업일이거나 미등록).</li>';

    panel.innerHTML =
      '<h2>'+cfg.icon+' '+escapeHtml(cfg.title)+'</h2>' +
      '<p class="desc">'+escapeHtml(data.dateDisplay || "")+' 기준</p>' +
      '<div class="tt-selects">' +
        '<select id="ttGrade" aria-label="학년 선택">' + grades.map(function(g){ return '<option value="'+g+'"'+(g===grade?' selected':'')+'>'+g+'학년</option>'; }).join("") + '</select>' +
        '<select id="ttClass" aria-label="반 선택">' + classes.map(function(c){ return '<option value="'+c+'"'+(String(c)===klass?' selected':'')+'>'+c+'반</option>'; }).join("") + '</select>' +
      '</div>' +
      '<ul class="tt-periods">'+periodsHtml+'</ul>' +
      syncLineHtml(data);

    panel.querySelector("#ttGrade").addEventListener("change", function(e){
      safeSet("ojeong_grade", e.target.value);
      safeSet("ojeong_class", "");
      paint();
    });
    panel.querySelector("#ttClass").addEventListener("change", function(e){
      safeSet("ojeong_class", e.target.value);
      paint();
    });
  }

  paint();
  subscribeStatusDoc(function(d){ data = d; paint(); });
}

/* ---- 다가오는 일정 (D-day, 나이스 자동 갱신) ---- */
function renderUpcomingSection(panel, cfg){
  var data = STATUS_SEED;

  function paint(){
    var items = (data.schedule || []).filter(function(ev){ return daysBetween(ev.date) >= 0; }).slice(0, 15);
    var body = items.length
      ? '<div class="sched-scroll">' + items.map(function(ev){
          var d = daysBetween(ev.date);
          var ddayLabel = d === 0 ? "D-DAY" : ("D-" + d);
          var urgentClass = d <= 3 ? " urgent" : "";
          var md = ev.date.slice(5).replace("-", ".");
          return '<div class="sched-chip'+urgentClass+'">' +
            '<span class="dday">'+ddayLabel+'</span>' +
            '<span class="d">'+md+' · '+escapeHtml(ev.type||"")+'</span>' +
            '<span class="n">'+escapeHtml(ev.name)+'</span>' +
          '</div>';
        }).join("") + '</div>'
      : '<div class="tt-empty">예정된 학사일정이 없습니다.</div>';

    panel.innerHTML =
      '<h2>'+cfg.icon+' '+escapeHtml(cfg.title)+'</h2>' +
      '<p class="desc">나이스 학사일정 기준 · 연간 학사일정 전체는 "학사일정" 탭을 확인하세요</p>' +
      body +
      syncLineHtml(data);
  }

  paint();
  subscribeStatusDoc(function(d){ data = d; paint(); });
}

/* ---- generic table section (정기용역 / 공사업체 / 거래처 / 학사일정) ---- */
function renderTableSection(panel, cfg){
  var state = { rows: rowsFromSeed(cfg.columns, cfg.seed), note: cfg.note || "" };

  function paint(){
    var head = '<tr>' + cfg.columns.map(function(c){
      return '<th style="min-width:'+c[2]+'">'+escapeHtml(c[1])+'</th>';
    }).join("") + '<th style="width:34px"></th></tr>';

    var body = state.rows.map(function(row, ri){
      var cells = cfg.columns.map(function(c){
        return '<td><input type="text" data-r="'+ri+'" data-c="'+c[0]+'" value="'+escapeHtml(row[c[0]])+'"></td>';
      }).join("");
      return '<tr>' + cells + '<td><button class="rowdel" data-del="'+ri+'" title="행 삭제">✕</button></td></tr>';
    }).join("");

    var noteHtml = cfg.note != null ? (
      '<div class="note-area"><label>참고</label><textarea id="noteField">'+escapeHtml(state.note)+'</textarea></div>'
    ) : "";

    panel.innerHTML =
      '<h2>'+cfg.icon+' '+escapeHtml(cfg.title)+'</h2>' +
      '<div class="tablewrap"><table class="datagrid"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>' +
      '<button class="addrow" id="addBtn">+ 행 추가</button>' +
      noteHtml;

    panel.querySelectorAll("input[data-r]").forEach(function(inp){
      inp.addEventListener("input", function(){
        var ri = Number(inp.getAttribute("data-r")), key = inp.getAttribute("data-c");
        state.rows[ri][key] = inp.value;
        scheduleSave();
      });
    });
    panel.querySelectorAll("button[data-del]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var ri = Number(btn.getAttribute("data-del"));
        state.rows.splice(ri, 1);
        paint();
        saveNow();
      });
    });
    panel.querySelector("#addBtn").addEventListener("click", function(){
      var o = {}; cfg.columns.forEach(function(c){ o[c[0]] = ""; });
      state.rows.push(o);
      paint();
      panel.querySelector('input[data-r="'+(state.rows.length-1)+'"]').focus();
    });
    var nf = panel.querySelector("#noteField");
    if (nf) nf.addEventListener("input", function(){ state.note = nf.value; scheduleSave(); });
  }

  var scheduleSave = debounce(saveNow, 500);
  function saveNow(){
    if (!db) return;
    var payload = { rows: state.rows };
    if (cfg.note != null) payload.note = state.note;
    db.doc("sections/" + cfg.key).update(payload).catch(function(){
      db.doc("sections/" + cfg.key).set(payload).catch(function(){});
    });
  }

  paint();

  if (db) {
    var unsub = db.doc("sections/" + cfg.key).onSnapshot(function(snap){
      if (snap.exists) {
        var data = snap.data();
        if (data && data.rows) {
          state.rows = data.rows;
          if (cfg.note != null && typeof data.note === "string") state.note = data.note;
          markSynced();
          paint();
        }
      }
    }, function(){ /* ignore */ });
    unsubs.push(unsub);
  }
}

/* ---- staff schedule (month calendar) ---- */
function renderScheduleSection(panel, cfg){
  var days = JSON.parse(JSON.stringify(STAFF_SCHEDULE_SEED));
  var dayNames = ["일","월","화","수","목","금","토"];
  var today0 = new Date();
  var viewYear = today0.getFullYear();
  var viewMonth = today0.getMonth(); // 0-indexed

  var dutySyncByDate = {}; // ymd -> [{name,type,period,destination,pending}] (나이스 확장에서 동기화)
  var dutySyncMeta = null; // {monthKey, syncedAt, scope}
  var dutySyncUnsub = null;

  function fmt(d){
    var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), dd = String(d.getDate()).padStart(2,"0");
    return y + "-" + m + "-" + dd;
  }
  function isToday(d){
    var t = new Date();
    return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
  }
  function currentMonthKey(){
    return viewYear + "-" + String(viewMonth+1).padStart(2,"0");
  }

  function paint(){
    var firstOfMonth = new Date(viewYear, viewMonth, 1);
    var startDow = firstOfMonth.getDay();
    var gridStart = new Date(viewYear, viewMonth, 1 - startDow);
    var lastOfMonth = new Date(viewYear, viewMonth + 1, 0);
    var endDow = lastOfMonth.getDay();
    var gridEnd = new Date(viewYear, viewMonth, lastOfMonth.getDate() + (6 - endDow));
    var totalDays = Math.round((gridEnd - gridStart) / 86400000) + 1;

    var dowHtml = dayNames.map(function(n, i){
      var cls = i === 0 ? "sun" : (i === 6 ? "sat" : "");
      return '<span class="'+cls+'">'+n+'</span>';
    }).join("");

    var cellsHtml = "";
    for (var i=0;i<totalDays;i++){
      var d = new Date(gridStart); d.setDate(d.getDate() + i);
      var key = fmt(d);
      var list = days[key] || [];
      var inMonth = d.getMonth() === viewMonth;
      var dow = d.getDay();
      var numCls = dow === 0 ? "sun" : (dow === 6 ? "sat" : "");
      var entries = list.map(function(txt, idx){
        return '<div class="entry"><input type="text" data-date="'+key+'" data-idx="'+idx+'" value="'+escapeHtml(txt)+'">' +
          '<button data-deldate="'+key+'" data-delidx="'+idx+'">✕</button></div>';
      }).join("");
      var syncedRows = inMonth ? (dutySyncByDate[key] || []) : [];
      var syncedHtml = syncedRows.map(function(item){
        var titleParts = [];
        if (item.period) titleParts.push(item.period);
        if (item.destination) titleParts.push(item.destination);
        var titleAttr = "나이스 연동" + (titleParts.length ? " · " + titleParts.join(" · ") : "");
        var label = escapeHtml(item.name || "") + " " + escapeHtml(item.type || "복무") + (item.pending ? " (결재중)" : "");
        return '<div class="entry synced" title="'+escapeHtml(titleAttr)+'"><span class="sync-tag">🔄</span>'+label+'</div>';
      }).join("");
      cellsHtml +=
        '<div class="daycell'+(inMonth ? '' : ' otherMonth')+(isToday(d) ? ' today' : '')+'">' +
          '<div class="dnum '+numCls+'">'+d.getDate()+'</div>' +
          entries +
          syncedHtml +
          '<button class="addentry" data-adddate="'+key+'">+ 추가</button>' +
        '</div>';
    }

    var dutySyncLine = (dutySyncMeta && dutySyncMeta.syncedAt)
      ? '<p class="duty-sync-line">🔄 나이스 복무 동기화: '+escapeHtml(dutySyncMeta.scope || "")+' · '+escapeHtml(formatUpdated(dutySyncMeta.syncedAt))+' 기준 ('+escapeHtml(dutySyncMeta.monthKey)+') · <a href="./neis-sync.html" target="_blank" rel="noopener">동기화 방법 안내</a></p>'
      : '<p class="duty-sync-line">🔄 '+escapeHtml(currentMonthKey())+'월은 아직 나이스 복무 동기화 데이터가 없습니다 · <a href="./neis-sync.html" target="_blank" rel="noopener">확장 설치 없이 동기화하는 방법 보기</a></p>';

    panel.innerHTML =
      '<h2>🗓️ 직원 일정표</h2>' +
      '<p class="desc">출장·연가·재택·병가 등을 날짜 칸에 적어두면 다 함께 실시간으로 봅니다. 점선 테두리(🔄) 항목은 나이스에서 자동 동기화된 내용이라 직접 수정할 수 없어요.</p>' +
      '<div class="monthnav">' +
        '<button id="prevMonth">‹ 이전 달</button>' +
        '<span class="range">'+viewYear+'년 '+(viewMonth+1)+'월</span>' +
        '<button id="nextMonth">다음 달 ›</button>' +
        '<button id="todayMonth">이번 달</button>' +
      '</div>' +
      '<div class="calwrap">' +
        '<div class="dowrow">'+dowHtml+'</div>' +
        '<div class="monthgrid">'+cellsHtml+'</div>' +
      '</div>' +
      dutySyncLine;

    panel.querySelector("#prevMonth").addEventListener("click", function(){
      viewMonth--; if (viewMonth < 0){ viewMonth = 11; viewYear--; } subscribeDutySync(); paint();
    });
    panel.querySelector("#nextMonth").addEventListener("click", function(){
      viewMonth++; if (viewMonth > 11){ viewMonth = 0; viewYear++; } subscribeDutySync(); paint();
    });
    panel.querySelector("#todayMonth").addEventListener("click", function(){
      var t = new Date(); viewYear = t.getFullYear(); viewMonth = t.getMonth(); subscribeDutySync(); paint();
    });

    panel.querySelectorAll("input[data-date]").forEach(function(inp){
      inp.addEventListener("input", function(){
        var k = inp.getAttribute("data-date"), idx = Number(inp.getAttribute("data-idx"));
        days[k][idx] = inp.value;
        scheduleSave();
      });
    });
    panel.querySelectorAll("button[data-deldate]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var k = btn.getAttribute("data-deldate"), idx = Number(btn.getAttribute("data-delidx"));
        days[k].splice(idx,1);
        paint(); saveNow();
      });
    });
    panel.querySelectorAll("button[data-adddate]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var k = btn.getAttribute("data-adddate");
        if (!days[k]) days[k] = [];
        days[k].push("");
        paint();
        var inputs = panel.querySelectorAll('input[data-date="'+k+'"]');
        if (inputs.length) inputs[inputs.length-1].focus();
      });
    });
  }

  var scheduleSave = debounce(saveNow, 500);
  function saveNow(){
    if (!db) return;
    db.doc("sections/schedule").update({ days: days }).catch(function(){
      db.doc("sections/schedule").set({ days: days }).catch(function(){});
    });
  }

  /* 나이스 "부서 복무 달력" 확장(v1.7+)에서 "사이버행정실로 동기화"를 누르면 채워지는 문서를 구독.
     보고 있는 달이 바뀌면 그 달에 해당하는 문서로 다시 구독한다. 수동 입력(days)과는 완전히 별도 저장소라
     동기화가 수동으로 적어둔 내용을 절대 덮어쓰지 않는다. */
  function subscribeDutySync(){
    if (dutySyncUnsub) { dutySyncUnsub(); dutySyncUnsub = null; }
    dutySyncByDate = {};
    dutySyncMeta = null;
    if (!db) return;
    var monthKey = currentMonthKey();
    dutySyncUnsub = db.doc("status/duty_sync_" + monthKey).onSnapshot(function(snap){
      if (snap.exists) {
        var data = snap.data();
        var parsed = data && typeof data.byDateJson === "string" ? safeJsonParse(data.byDateJson) : null;
        dutySyncByDate = parsed || {};
        dutySyncMeta = { monthKey: monthKey, syncedAt: data && data.syncedAt, scope: data && data.scope };
      } else {
        dutySyncByDate = {};
        dutySyncMeta = null;
      }
      paint();
    }, function(){ /* ignore */ });
    unsubs.push(dutySyncUnsub);
  }

  paint();
  subscribeDutySync();

  if (db) {
    var unsub = db.doc("sections/schedule").onSnapshot(function(snap){
      if (snap.exists) {
        var data = snap.data();
        if (data && data.days) { days = data.days; markSynced(); paint(); }
      }
    }, function(){});
    unsubs.push(unsub);
  }
}

/* ---- periods (시정표) ---- */
function renderPeriodsSection(panel, cfg){
  var groups = JSON.parse(JSON.stringify(cfg.groups));

  function paint(){
    var groupsHtml = groups.map(function(g, gi){
      var rows = g.rows.map(function(r, ri){
        return '<tr>' +
          '<td><input data-g="'+gi+'" data-r="'+ri+'" data-c="0" value="'+escapeHtml(r[0])+'"></td>' +
          '<td><input data-g="'+gi+'" data-r="'+ri+'" data-c="1" value="'+escapeHtml(r[1])+'"></td>' +
          '<td><button class="rowdel" data-delg="'+gi+'" data-delr="'+ri+'">✕</button></td>' +
        '</tr>';
      }).join("");
      return '<div class="periodgroup"><h3>'+escapeHtml(g.label)+'</h3>' +
        '<table class="datagrid"><tbody>'+rows+'</tbody></table>' +
        '<button class="addrow" data-addg="'+gi+'">+ 행 추가</button></div>';
    }).join("");

    panel.innerHTML = '<h2>⏰ 시정표</h2><div class="periodgroups">'+groupsHtml+'</div>';

    panel.querySelectorAll("input[data-g]").forEach(function(inp){
      inp.addEventListener("input", function(){
        var g = Number(inp.getAttribute("data-g")), r = Number(inp.getAttribute("data-r")), c = Number(inp.getAttribute("data-c"));
        groups[g].rows[r][c] = inp.value;
        scheduleSave();
      });
    });
    panel.querySelectorAll("button[data-delg]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var g = Number(btn.getAttribute("data-delg")), r = Number(btn.getAttribute("data-delr"));
        groups[g].rows.splice(r,1); paint(); saveNow();
      });
    });
    panel.querySelectorAll("button[data-addg]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var g = Number(btn.getAttribute("data-addg"));
        groups[g].rows.push(["",""]); paint(); saveNow();
      });
    });
  }

  var scheduleSave = debounce(saveNow, 500);
  function saveNow(){
    if (!db) return;
    db.doc("sections/periods").update({ groups: groups }).catch(function(){
      db.doc("sections/periods").set({ groups: groups }).catch(function(){});
    });
  }

  paint();

  if (db) {
    var unsub = db.doc("sections/periods").onSnapshot(function(snap){
      if (snap.exists) {
        var data = snap.data();
        if (data && data.groups) { groups = data.groups; markSynced(); paint(); }
      }
    }, function(){});
    unsubs.push(unsub);
  }
}

/* ---- classroom map (image upload via assets) ---- */
function renderMapSection(panel, cfg){
  var state = { assetId: null, url: null, note: "" };

  function paint(){
    var body;
    if (state.url) {
      body = '<div class="mapbox"><img src="'+state.url+'" alt="교실배치도"></div>';
    } else {
      body = '<div class="placeholder">아직 등록된 교실배치도 이미지가 없습니다. 시트에서는 그림(도면)으로만 되어 있어 자동으로 가져오지 못했어요 — 아래 버튼으로 사진이나 스캔본을 올려주시면 모두에게 바로 보입니다.</div>';
    }
    panel.innerHTML =
      '<h2>🗺️ 교실배치도</h2>' +
      body +
      '<div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
        '<input type="file" id="mapFile" accept="image/*" style="display:none">' +
        '<button class="uploadbtn" id="mapUploadBtn">'+(state.url ? "이미지 교체" : "이미지 업로드")+'</button>' +
        '<span class="desc" id="mapStatus" style="margin:0;"></span>' +
      '</div>' +
      '<div class="note-area"><label>비고</label><textarea id="mapNote">'+escapeHtml(state.note)+'</textarea></div>';

    var fileInp = panel.querySelector("#mapFile");
    panel.querySelector("#mapUploadBtn").addEventListener("click", function(){
      if (!assets) {
        panel.querySelector("#mapStatus").textContent = "이 화면에서는 업로드 권한이 없어요 (이미 있는 이미지는 볼 수 있어요).";
        return;
      }
      fileInp.click();
    });
    fileInp.addEventListener("change", function(){
      var f = fileInp.files && fileInp.files[0];
      if (!f || !assets) return;
      panel.querySelector("#mapStatus").textContent = "업로드 중…";
      assets.upload(f).then(function(res){
        state.assetId = res.id; state.url = res.url;
        saveNow();
        paint();
      }).catch(function(){
        panel.querySelector("#mapStatus").textContent = "업로드에 실패했어요. 다시 시도해주세요.";
      });
    });
    panel.querySelector("#mapNote").addEventListener("input", function(){
      state.note = panel.querySelector("#mapNote").value;
      scheduleSave();
    });
  }

  var scheduleSave = debounce(saveNow, 600);
  function saveNow(){
    if (!db) return;
    var payload = { assetId: state.assetId, url: state.url, note: state.note };
    db.doc("sections/classroom_map").update(payload).catch(function(){
      db.doc("sections/classroom_map").set(payload).catch(function(){});
    });
  }

  paint();

  if (db) {
    var unsub = db.doc("sections/classroom_map").onSnapshot(function(snap){
      if (snap.exists) {
        var data = snap.data();
        if (data) {
          state.assetId = data.assetId || null;
          state.url = data.url || null;
          state.note = data.note || "";
          markSynced();
          paint();
        }
      }
    }, function(){});
    unsubs.push(unsub);
  }
}

/* ---------------- sync indicator ---------------- */
function markSynced(){
  var dot = document.getElementById("syncDot"), txt = document.getElementById("syncText");
  if (!dot) return;
  dot.classList.add("on");
  txt.textContent = "실시간 동기화됨";
}

/* ---------------- clock ---------------- */
function tickClock(){
  var now = new Date();
  var h = String(now.getHours()).padStart(2,"0");
  var m = String(now.getMinutes()).padStart(2,"0");
  var clockTime = document.getElementById("clockTime");
  var clockDate = document.getElementById("clockDate");
  if (!clockTime || !clockDate) return;
  clockTime.textContent = h + ":" + m;
  var days = ["일","월","화","수","목","금","토"];
  clockDate.textContent = now.getFullYear()+"년 "+(now.getMonth()+1)+"월 "+now.getDate()+"일 ("+days[now.getDay()]+")";
}

   아래 firebaseConfig 값을 본인의 Firebase 프로젝트 값으로 반드시 교체하세요.
   Firebase 콘솔 > 프로젝트 설정(톱니바퀴) > 일반 탭 > 내 앱(웹 앱)에서 그대로 복사하면 됩니다.
   이 값들은 원래 공개되어도 안전하도록 설계된 값입니다(비밀키가 아닙니다) —
   실제 보안(로그인 없이도 함부로 지우거나 훼손하지 못하게)은 Firestore/Storage 규칙이 담당합니다.
   같이 보내드린 "설정가이드.md" 파일을 따라하면 이 값을 채우는 방법이 자세히 나와 있습니다. */

/* db/assets 어댑터: 기존 Claude 아티팩트의 db/assets 기능과 거의 같은 모양(doc().set/update/onSnapshot,
   assets.upload)으로 감싸서, 위의 모든 render*Section 함수를 그대로 재사용할 수 있게 합니다. */
function makeDbAdapter(firestoreDb){
  return {
    doc: function(path){
      var parts = path.split("/");
      var ref = firestoreDb.collection(parts[0]).doc(parts[1]);
      return {
        set: function(data){ return ref.set(data); },
        update: function(data){ return ref.update(data); },
        onSnapshot: function(onNext, onError){
          return ref.onSnapshot(function(snap){
            onNext({ exists: snap.exists, data: function(){ return snap.data(); } });
          }, onError || function(){});
        }
      };
    }
  };
}

function makeAssetsAdapter(storageInstance){
  return {
    upload: function(file){
      var safeName = (file.name || "image").replace(/[^a-zA-Z0-9._-]/g, "_");
      var id = Date.now() + "_" + Math.random().toString(36).slice(2) + "_" + safeName;
      var ref = storageInstance.ref().child("uploads/" + id);
      return ref.put(file).then(function(snap){
        return snap.ref.getDownloadURL().then(function(url){
          return { id: id, url: url, sizeBytes: file.size, contentType: file.type };
        });
      });
    }
  };
}

(function bootFirebase(){

  var notConfigured = !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf("여기에") === 0;

  if (typeof firebase === "undefined" || notConfigured){
    if (syncTxt) syncTxt.textContent = "설정 필요 (firebaseConfig 미입력)";
    if (banner) banner.classList.add("show");
    return;
  }

  try {
    firebase.initializeApp(firebaseConfig);
  } catch(e){
    if (syncTxt) syncTxt.textContent = "Firebase 연결 실패";
    if (banner) banner.classList.add("show");
    return;
  }

  firebase.auth().signInAnonymously().then(function(){
    db = makeDbAdapter(firebase.firestore());
    assets = makeAssetsAdapter(firebase.storage());
    buildPanels(); // db가 준비됐으니 실시간 구독을 붙여서 다시 그림
  }).catch(function(err){
    if (syncTxt) syncTxt.textContent = "연결 대기 중 (오프라인 모드)";
    if (banner) banner.classList.add("show");
    console.error("Firebase 익명 로그인 실패:", err);
  });
})();

})();
