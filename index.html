      '<div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
        '<input type="file" id="mapFile" accept="image/*" style="display:none">' +
        '<button class="uploadbtn" id="mapUploadBtn">'+(state.url ? "이미지 교체" : "이미지 업로드")+'</button>' +
        '<span class="desc" id="mapStatus" style="margin:0;"></span>' +
      '</div>' +
      '<div class="note-area"><label>비고</label><textarea id="mapNote">'+escapeHtml(state.note)+'</textarea></div>';

    var fileInp = panel.querySelector("#mapFile");
    panel.querySelector("#mapUploadBtn").addEventListener("click", function(){
      if (!assets) {
        panel.querySelector("#mapStatus").textContent = "이 화면에서는 업로드 권한이 없어요 (이미 있는 이미지는 볼 수 있어요).";
        return;
      }
      fileInp.click();
    });
    fileInp.addEventListener("change", function(){
      var f = fileInp.files && fileInp.files[0];
      if (!f || !assets) return;
      panel.querySelector("#mapStatus").textContent = "업로드 중…";
      assets.upload(f).then(function(res){
        state.assetId = res.id; state.url = res.url;
        saveNow();
        paint();
      }).catch(function(){
        panel.querySelector("#mapStatus").textContent = "업로드에 실패했어요. 다시 시도해주세요.";
      });
    });
    panel.querySelector("#mapNote").addEventListener("input", function(){
      state.note = panel.querySelector("#mapNote").value;
      scheduleSave();
    });
  }

  var scheduleSave = debounce(saveNow, 600);
  function saveNow(){
    if (!db) return;
    var payload = { assetId: state.assetId, url: state.url, note: state.note };
    db.doc("sections/classroom_map").update(payload).catch(function(){
      db.doc("sections/classroom_map").set(payload).catch(function(){});
    });
  }

  paint();

  if (db) {
    var unsub = db.doc("sections/classroom_map").onSnapshot(function(snap){
      if (snap.exists) {
        var data = snap.data();
        if (data) {
          state.assetId = data.assetId || null;
          state.url = data.url || null;
          state.note = data.note || "";
          markSynced();
          paint();
        }
      }
    }, function(){});
    unsubs.push(unsub);
  }
}

/* ---- 공사 현장 사진 아카이브 (사업명 카테고리 → 공사전/중/후 → 날짜별 그룹, 사진만, Firebase Storage 업로드) ----
   휴대폰에서 사진을 보내는 화면은 이 사이트가 아니라 별도 파일(gongsa-sajin-upload.html)이며,
   같은 Firestore 문서(sections/construction_archive)를 공유해서 카테고리·사진이 서로 실시간 연동됨. */
var ARCHIVE_MAX_BYTES = 12 * 1024 * 1024; // 사진 1장당 12MB 상한 (용량 관리)
var ARCHIVE_PHASES = [
  { key:"before", label:"공사전" },
  { key:"during", label:"공사중" },
  { key:"after", label:"공사후" }
];
function archivePhaseLabel(key){
  for (var i=0;i<ARCHIVE_PHASES.length;i++){ if (ARCHIVE_PHASES[i].key === key) return ARCHIVE_PHASES[i].label; }
  return key;
}
function todayDateValue(){
  var d = new Date();
  var pad = function(n){ return String(n).padStart(2,"0"); };
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function formatArchiveDate(dateStr){
  if (!dateStr) return "(날짜 미기입)";
  var days = ["일","월","화","수","목","금","토"];
  var d = new Date(dateStr + "T00:00:00");
  if (isNaN(d.getTime())) return dateStr;
  return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+days[d.getDay()]+")";
}
function formatArchiveDateNoWeekday(dateStr){
  if (!dateStr) return "";
  var d = new Date(dateStr + "T00:00:00");
  if (isNaN(d.getTime())) return dateStr;
  return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일";
}
function addOneMonth(dateStr){
  var d = new Date(dateStr + "T00:00:00");
  if (isNaN(d.getTime())) return null;
  var nd = new Date(d.getFullYear(), d.getMonth()+1, d.getDate());
  var pad = function(n){ return String(n).padStart(2,"0"); };
  return nd.getFullYear()+"-"+pad(nd.getMonth()+1)+"-"+pad(nd.getDate());
}
function archiveCategoryLabel(categories, id){
  for (var i=0;i<categories.length;i++){ if (categories[i].id === id) return categories[i].label; }
  return "(알 수 없음)";
}
function groupByDate(list){
  var map = {}, order = [];
  list.forEach(function(p){
    var key = p.date || "(날짜 미기입)";
    if (!map[key]) { map[key] = []; order.push(key); }
    map[key].push(p);
  });
  order.sort(function(a,b){ return a < b ? 1 : (a > b ? -1 : 0); }); // 최신 날짜가 위로
  return order.map(function(key){ return { date: key, items: map[key] }; });
}

var ARCHIVE_CONTACT_COLUMNS = [
  ["role","직","90px"],
  ["name","상호","170px"],
  ["companyPhone","전화번호(회사)","160px"],
  ["personalPhone","전화번호(개인)","160px"],
  ["note","비고","200px"]
];

function renderConstructionArchiveSection(panel, cfg){
  var state = { categories: [], photos: [], contacts: [], activeCategory: null, phaseFilter: "all" };

  function visiblePhotos(){
    var list = state.photos;
    if (state.activeCategory){
      list = list.filter(function(p){ return p.categoryId === state.activeCategory; });
      if (state.phaseFilter !== "all") list = list.filter(function(p){ return p.phase === state.phaseFilter; });
    }
    return list;
  }

  function lastAfterDate(categoryId){
    var maxDate = null;
    state.photos.forEach(function(p){
      if (p.categoryId === categoryId && p.phase === "after" && p.date){
        if (!maxDate || p.date > maxDate) maxDate = p.date;
      }
    });
    return maxDate;
  }

  function isCategoryCompleted(categoryId){
    var last = lastAfterDate(categoryId);
    if (!last) return false;
    var threshold = addOneMonth(last);
    if (!threshold) return false;
    return todayDateValue() >= threshold;
  }

  function paint(){
    var activeCategories = state.categories.filter(function(c){ return !isCategoryCompleted(c.id); });
    var completedCategories = state.categories.filter(function(c){ return isCategoryCompleted(c.id); })
      .map(function(c){ return { id:c.id, label:c.label, lastDate: lastAfterDate(c.id) }; })
      .sort(function(a,b){ return (b.lastDate||"") < (a.lastDate||"") ? -1 : ((b.lastDate||"") > (a.lastDate||"") ? 1 : 0); });

    var catTabsHtml = '<button data-cat="" class="'+(!state.activeCategory?"active":"")+'">전체</button>' +
      '<button type="button" id="archiveAddCatBtn" title="사업명 추가">＋</button>' +
      activeCategories.map(function(c){
        return '<button data-cat="'+escapeHtml(c.id)+'" class="'+(state.activeCategory===c.id?"active":"")+'">'+escapeHtml(c.label)+'</button>';
      }).join("");

    var completedDropdownHtml = completedCategories.length
      ? '<select id="archiveCompletedSelect" class="other-tab-select" title="공사후 마지막 사진 1개월 뒤 자동으로 여기에 모입니다">' +
          '<option value="">✅ 공사완료 ('+completedCategories.length+')</option>' +
          completedCategories.map(function(c){
            return '<option value="'+escapeHtml(c.id)+'"'+(state.activeCategory===c.id?" selected":"")+'>'+
              escapeHtml(formatArchiveDateNoWeekday(c.lastDate))+' '+escapeHtml(c.label)+'</option>';
          }).join("") +
        '</select>'
      : '';

    var phaseTabsHtml = "";
    if (state.activeCategory){
      phaseTabsHtml = '<div class="archive-phase-tabs" id="archivePhaseTabs" style="margin-top:8px;">' +
        '<button data-f="all" class="'+(state.phaseFilter==="all"?"active":"")+'">전체</button>' +
        ARCHIVE_PHASES.map(function(ph){
          return '<button data-f="'+ph.key+'" class="'+(state.phaseFilter===ph.key?"active":"")+'">'+ph.label+'</button>';
        }).join("") +
        '<button data-f="contacts" class="'+(state.phaseFilter==="contacts"?"active":"")+'">📇 연락처</button>' +
      '</div>';
    }

    var isContactsView = state.activeCategory && state.phaseFilter === "contacts";
    var bodyHtml;
    if (!state.categories.length){
      bodyHtml = '<div class="placeholder archive-empty">아직 등록된 사업명이 없습니다. 위 ＋ 버튼으로 "공간드림사업"처럼 진행 중인 사업명을 먼저 추가해 주세요.</div>';
    } else if (isContactsView){
      bodyHtml = contactsTableHtml();
    } else {
      var groups = groupByDate(visiblePhotos());
      if (!groups.length){
        bodyHtml = '<div class="placeholder archive-empty">아직 등록된 사진이 없습니다. "사진 추가" 버튼으로 올려주세요.</div>';
      } else {
        bodyHtml = groups.map(function(g){
          var cardsHtml = g.items.map(function(p){
            return '<div class="archive-card" data-id="'+escapeHtml(p.id)+'">' +
              '<img src="'+escapeHtml(p.url)+'" alt="공사 현장 사진" loading="lazy">' +
              (isEditUnlocked() ? '<button type="button" class="delbtn" data-del="'+escapeHtml(p.id)+'" title="삭제">✕</button>' : '') +
              '<div class="meta">' +
                '<span class="badge '+escapeHtml(p.phase)+'">'+escapeHtml(archivePhaseLabel(p.phase))+'</span>' +
                (!state.activeCategory ? '<div class="loc" style="color:var(--accent);">'+escapeHtml(archiveCategoryLabel(state.categories, p.categoryId))+'</div>' : '') +
                '<div class="loc">'+escapeHtml(p.location || "(장소 미기입)")+'</div>' +
              '</div>' +
            '</div>';
          }).join("");
          return '<div class="archive-date-group">' +
            '<div class="archive-date-heading">'+escapeHtml(formatArchiveDate(g.date))+'</div>' +
            '<div class="archive-grid">'+cardsHtml+'</div>' +
          '</div>';
        }).join("");
      }
    }

    panel.innerHTML =
      '<h2>📷 공사 현장 사진</h2>' +
      '<p class="desc">공사후 마지막 사진 이후 1개월이 지나면 "공사완료" 목록으로 자동으로 옮겨집니다. <a href="gongsa-sajin-upload.html" target="_blank" rel="noopener">📱 공사 현장 사진 모바일 제보 페이지</a></p>' +
      '<div class="archive-toolbar">' +
        '<div class="archive-phase-tabs" id="archiveCatTabs">'+catTabsHtml+'</div>' +
        completedDropdownHtml +
        (isContactsView ? '' : '<button type="button" class="archive-addbtn" id="archiveAddBtn">＋ 사진 추가</button>') +
      '</div>' +
      phaseTabsHtml +
      '<div id="archiveBody" style="margin-top:12px;">'+bodyHtml+'</div>';

    var completedSelectEl = panel.querySelector("#archiveCompletedSelect");
    if (completedSelectEl){
      completedSelectEl.addEventListener("change", function(e){
        var val = e.target.value;
        if (!val) return;
        state.activeCategory = val;
        state.phaseFilter = "all";
        paint();
      });
    }

    panel.querySelector("#archiveCatTabs").addEventListener("click", function(e){
      if (e.target.closest("#archiveAddCatBtn")) { openAddCategoryForm(); return; }
      var btn = e.target.closest("button[data-cat]");
      if (!btn) return;
      state.activeCategory = btn.getAttribute("data-cat") || null;
      state.phaseFilter = "all";
      paint();
    });

    var phaseTabsEl = panel.querySelector("#archivePhaseTabs");
    if (phaseTabsEl){
      phaseTabsEl.addEventListener("click", function(e){
        var btn = e.target.closest("button[data-f]");
        if (!btn) return;
        state.phaseFilter = btn.getAttribute("data-f");
        paint();
      });
    }

    if (isContactsView){
      wireContactsTable(panel);
    } else {
      panel.querySelector("#archiveAddBtn").addEventListener("click", function(){
        if (!assets) { alert("아직 사진 저장소 연결 중입니다. 잠시 후 다시 시도해 주세요."); return; }
        if (!state.categories.length) { alert("먼저 위 ＋ 버튼으로 사업명을 추가해 주세요."); return; }
        if (isArchiveUploadUnlocked()) openArchiveUploadForm();
        else showArchiveUploadLockModal(openArchiveUploadForm);
      });
    }

    Array.prototype.forEach.call(panel.querySelectorAll("[data-del]"), function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var id = btn.getAttribute("data-del");
        if (!isEditUnlocked()) { showEditLockModal(); return; }
        if (!confirm("이 사진을 삭제할까요? 되돌릴 수 없습니다.")) return;
        var target = null;
        for (var i=0;i<state.photos.length;i++){ if (state.photos[i].id === id){ target = state.photos[i]; break; } }
        if (target) removeArchivePhoto(target);
      });
    });

    Array.prototype.forEach.call(panel.querySelectorAll(".archive-card img"), function(img){
      img.addEventListener("click", function(){
        var card = img.closest(".archive-card");
        var id = card.getAttribute("data-id");
        var p = null;
        for (var i=0;i<state.photos.length;i++){ if (state.photos[i].id === id){ p = state.photos[i]; break; } }
        if (p) showArchiveLightbox(p);
      });
    });
  }

  function showArchiveLightbox(p){
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML =
      '<div class="modal-card" role="dialog" aria-modal="true" style="width:min(560px,100%);">' +
        '<img class="archive-lightbox-img" src="'+escapeHtml(p.url)+'" alt="공사 현장 사진">' +
        '<div><span class="badge '+escapeHtml(p.phase)+'">'+escapeHtml(archivePhaseLabel(p.phase))+'</span> ' +
          '<span class="badge" style="background:var(--surface-2);color:var(--ink);">'+escapeHtml(archiveCategoryLabel(state.categories, p.categoryId))+'</span></div>' +
        '<div class="loc" style="margin-top:8px;">'+escapeHtml(formatArchiveDate(p.date))+'</div>' +
        '<div class="dt">'+escapeHtml(p.location || "")+'</div>' +
        (p.note ? '<div class="desc" style="margin-top:8px;">'+escapeHtml(p.note)+'</div>' : '') +
        '<div class="modal-actions"><button type="button" id="archiveLightboxClose">닫기</button></div>' +
      '</div>';
    document.body.appendChild(overlay);
    function close(){ overlay.remove(); }
    overlay.querySelector("#archiveLightboxClose").addEventListener("click", close);
    overlay.addEventListener("mousedown", function(e){ if (e.target === overlay) close(); });
  }

  function contactsTableHtml(){
    var rows = state.contacts.filter(function(c){ return c.categoryId === state.activeCategory; });
    var head = '<tr>' + ARCHIVE_CONTACT_COLUMNS.map(function(c){
      return '<th style="min-width:'+c[2]+'">'+escapeHtml(c[1])+'</th>';
    }).join("") + '<th style="width:34px"></th></tr>';
    var body = rows.map(function(row){
      var cells = ARCHIVE_CONTACT_COLUMNS.map(function(c){
        return '<td><input type="text" data-cid="'+escapeHtml(row.id)+'" data-c="'+c[0]+'" value="'+escapeHtml(row[c[0]]||"")+'"></td>';
      }).join("");
      return '<tr>' + cells + '<td><button class="rowdel" data-delcid="'+escapeHtml(row.id)+'" title="행 삭제">✕</button></td></tr>';
    }).join("");
    return '<div class="tablewrap"><table class="datagrid"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>' +
      '<button class="addrow" id="archiveContactAddBtn">+ 연락처 추가</button>';
  }

  function wireContactsTable(panel){
    Array.prototype.forEach.call(panel.querySelectorAll("input[data-cid]"), function(inp){
      inp.addEventListener("input", function(){
        var cid = inp.getAttribute("data-cid"), key = inp.getAttribute("data-c");
        for (var i=0;i<state.contacts.length;i++){
          if (state.contacts[i].id === cid){ state.contacts[i][key] = inp.value; break; }
        }
        scheduleContactsSave();
      });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-delcid]"), function(btn){
      btn.addEventListener("click", function(){
        var cid = btn.getAttribute("data-delcid");
        state.contacts = state.contacts.filter(function(c){ return c.id !== cid; });
        paint();
        saveContacts();
      });
    });
    var addBtn = panel.querySelector("#archiveContactAddBtn");
    if (addBtn){
      addBtn.addEventListener("click", function(){
        var row = { id: "ct_" + Date.now() + "_" + Math.random().toString(36).slice(2,7), categoryId: state.activeCategory };
        ARCHIVE_CONTACT_COLUMNS.forEach(function(c){ row[c[0]] = ""; });
        state.contacts.push(row);
        paint();
        var firstInput = panel.querySelector('input[data-cid="'+row.id+'"]');
        if (firstInput) firstInput.focus();
      });
    }
  }

  function openAddCategoryForm(){
    if (!isEditUnlocked()) { showEditLockModal(); return; }
    if (document.getElementById("archiveCatOverlay")) return;
    var overlay = document.createElement("div");
    overlay.id = "archiveCatOverlay";
    overlay.className = "modal-overlay";
    overlay.innerHTML =
      '<div class="modal-card" role="dialog" aria-modal="true">' +
        '<h3>＋ 사업명 추가</h3>' +
        '<p class="modal-desc">예: 공간드림사업, 화장실 개선공사 등 진행 중인 사업 이름을 적어주세요.</p>' +
        '<input type="text" class="editlock-input" id="archiveCatInput" placeholder="사업명" autocomplete="off">' +
        '<div class="archive-form-error" id="archiveCatError">사업명을 입력해 주세요.</div>' +
        '<div class="modal-actions">' +
          '<button type="button" id="archiveCatCancel">취소</button>' +
          '<button type="button" class="primary" id="archiveCatConfirm">확인</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    var input = overlay.querySelector("#archiveCatInput");
    function close(){ overlay.remove(); }
    function confirmAdd(){
      var label = input.value.trim();
      if (!label) { overlay.querySelector("#archiveCatError").style.display = "block"; return; }
      var cat = { id: "cat_" + Date.now() + "_" + Math.random().toString(36).slice(2,7), label: label, createdAt: new Date().toISOString() };
      state.categories.push(cat);
      state.activeCategory = cat.id;
      state.phaseFilter = "all";
      saveCategoryAdd(cat);
      close();
      paint();
    }
    overlay.querySelector("#archiveCatCancel").addEventListener("click", close);
    overlay.querySelector("#archiveCatConfirm").addEventListener("click", confirmAdd);
    input.addEventListener("keydown", function(e){ if (e.key === "Enter") confirmAdd(); });
    overlay.addEventListener("mousedown", function(e){ if (e.target === overlay) close(); });
    setTimeout(function(){ input.focus(); }, 30);
  }

  function openArchiveUploadForm(){
    if (document.getElementById("archiveUploadOverlay")) return;
    var overlay = document.createElement("div");
    overlay.id = "archiveUploadOverlay";
    overlay.className = "modal-overlay";
    var defaultCat = state.activeCategory || (state.categories[0] && state.categories[0].id) || "";
    var defaultPhase = state.phaseFilter !== "all" ? state.phaseFilter : "before";
    overlay.innerHTML =
      '<div class="modal-card" role="dialog" aria-modal="true">' +
        '<h3>📷 공사 현장 사진 추가</h3>' +
        '<div class="archive-form-row"><label>사업명</label>' +
          '<select id="archiveCatSelect">' +
            state.categories.map(function(c){ return '<option value="'+escapeHtml(c.id)+'"'+(c.id===defaultCat?" selected":"")+'>'+escapeHtml(c.label)+'</option>'; }).join("") +
          '</select>' +
        '</div>' +
        '<div class="archive-form-row"><label>공사 단계</label>' +
          '<select id="archivePhaseInput">' +
            ARCHIVE_PHASES.map(function(ph){ return '<option value="'+ph.key+'"'+(ph.key===defaultPhase?" selected":"")+'>'+ph.label+'</option>'; }).join("") +
          '</select>' +
        '</div>' +
        '<div class="archive-form-row"><label>날짜</label>' +
          '<input type="date" id="archiveDateInput" value="'+todayDateValue()+'">' +
        '</div>' +
        '<div class="archive-form-row"><label>사진 선택</label>' +
          '<input type="file" id="archiveFileInput" accept="image/*">' +
        '</div>' +
        '<div class="archive-form-row"><label>장소 (선택)</label>' +
          '<input type="text" id="archiveLocationInput" placeholder="예: 본관 3층 복도">' +
        '</div>' +
        '<div class="archive-form-row"><label>메모 (선택)</label>' +
          '<textarea id="archiveNoteInput" placeholder="특이사항이 있으면 적어주세요"></textarea>' +
        '</div>' +
        '<div class="archive-form-error" id="archiveFormError"></div>' +
        '<div class="modal-actions">' +
          '<button type="button" id="archiveFormCancel">취소</button>' +
          '<button type="button" class="primary" id="archiveFormSave">저장</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);

    function close(){ overlay.remove(); }
    function showError(msg){
      var el = overlay.querySelector("#archiveFormError");
      el.textContent = msg; el.style.display = "block";
    }

    overlay.querySelector("#archiveFormCancel").addEventListener("click", close);
    overlay.addEventListener("mousedown", function(e){ if (e.target === overlay) close(); });

    overlay.querySelector("#archiveFormSave").addEventListener("click", function(){
      var fileInp = overlay.querySelector("#archiveFileInput");
      var f = fileInp.files && fileInp.files[0];
      if (!f) { showError("사진을 선택해 주세요."); return; }
      if (f.type.indexOf("image/") !== 0) { showError("이미지 파일만 올릴 수 있어요."); return; }
      if (f.size > ARCHIVE_MAX_BYTES) { showError("사진 용량이 너무 큽니다(12MB 이하로 올려주세요)."); return; }

      var saveBtn = overlay.querySelector("#archiveFormSave");
      saveBtn.disabled = true; saveBtn.textContent = "업로드 중…";

      var entry = {
        categoryId: overlay.querySelector("#archiveCatSelect").value,
        phase: overlay.querySelector("#archivePhaseInput").value,
        date: overlay.querySelector("#archiveDateInput").value || todayDateValue(),
        location: overlay.querySelector("#archiveLocationInput").value.trim(),
        note: overlay.querySelector("#archiveNoteInput").value.trim()
      };

      assets.upload(f).then(function(res){
        entry.id = res.id;
        entry.url = res.url;
        entry.uploadedAt = new Date().toISOString();
        state.photos.push(entry);
        addArchivePhoto(entry);
        close();
        paint();
      }).catch(function(){
        saveBtn.disabled = false; saveBtn.textContent = "저장";
        showError("업로드에 실패했어요. 네트워크 상태를 확인하고 다시 시도해 주세요.");
      });
    });
  }

  function archiveDocRef(){ return firebase.firestore().collection("sections").doc("construction_archive"); }

  var scheduleContactsSave = debounce(saveContacts, 500);
  function saveContacts(){
    if (!db) return;
    var ref = archiveDocRef();
    ref.update({ contacts: state.contacts }).catch(function(){
      ref.set({ contacts: state.contacts }, { merge: true }).catch(function(){});
    });
  }

  function saveCategoryAdd(cat){
    if (!db) return;
    var ref = archiveDocRef();
    ref.update({ categories: firebase.firestore.FieldValue.arrayUnion(cat) }).catch(function(){
      ref.set({ categories: [cat] }, { merge: true }).catch(function(){});
    });
  }

  function addArchivePhoto(entry){
    if (!db) return;
    var ref = archiveDocRef();
    ref.update({ photos: firebase.firestore.FieldValue.arrayUnion(entry) }).catch(function(){
      ref.set({ photos: [entry] }, { merge: true }).catch(function(){});
    });
  }

  function removeArchivePhoto(entry){
    state.photos = state.photos.filter(function(p){ return p.id !== entry.id; });
    paint();
    if (db) archiveDocRef().update({ photos: firebase.firestore.FieldValue.arrayRemove(entry) }).catch(function(){});
    if (assets && assets.remove) assets.remove(entry.id).catch(function(){});
  }

  paint();

  if (db) {
    var unsub = db.doc("sections/construction_archive").onSnapshot(function(snap){
      if (snap.exists) {
        var data = snap.data();
        if (data) {
          if (Array.isArray(data.categories)) state.categories = data.categories;
          if (Array.isArray(data.photos)) state.photos = data.photos;
          if (Array.isArray(data.contacts)) state.contacts = data.contacts;
          markSynced();
          paint();
        }
      }
    }, function(){});
    unsubs.push(unsub);
  }
}

/* ---- 시설 보수 현황 (교직원이 휴대폰으로 고장·보수 요청 사진 전송 → 시설주무관이 처리) ----
   휴대폰에서 요청을 보내는 화면은 이 사이트가 아니라 별도 파일(sisul-bosu-jeonsong.html)이며,
   같은 Firestore 문서(sections/facility_repair)를 공유해서 실시간 연동됨.
   처리중/처리완료/처리불가 구분은 이 홈페이지(데스크톱)에서만 보이고 조작할 수 있으며,
   교직원 전송 화면에는 이 구분이 전혀 노출되지 않음(모든 요청은 전송 시 자동으로 "처리중"이 됨). */
var REPAIR_STATUSES = [
  { key:"processing", label:"처리중" },
  { key:"done", label:"처리완료" },
  { key:"rejected", label:"처리불가" }
];
function repairStatusLabel(key){
  for (var i=0;i<REPAIR_STATUSES.length;i++){ if (REPAIR_STATUSES[i].key === key) return REPAIR_STATUSES[i].label; }
  return key;
}

function renderFacilityRepairSection(panel, cfg){
  var state = { reports: [], statusFilter: "processing" };

  function visibleReports(){
    if (state.statusFilter === "all") return state.reports;
    return state.reports.filter(function(r){ return r.status === state.statusFilter; });
  }

  function repairDocRef(){ return firebase.firestore().collection("sections").doc("facility_repair"); }

  function paint(){
    var tabsHtml = '<div class="archive-phase-tabs" id="repairStatusTabs">' +
      '<button data-f="all" class="'+(state.statusFilter==="all"?"active":"")+'">전체</button>' +
      REPAIR_STATUSES.map(function(s){
        return '<button data-f="'+s.key+'" class="'+(state.statusFilter===s.key?"active":"")+'">'+s.label+'</button>';
      }).join("") +
    '</div>';

    var groups = groupByDate(visibleReports());
    var bodyHtml;
    if (!groups.length){
      bodyHtml = '<div class="placeholder archive-empty">'+
        (state.statusFilter === "all" ? "아직 접수된 시설 보수 요청이 없습니다." : "해당 상태의 요청이 없습니다.") +
      '</div>';
    } else {
      bodyHtml = groups.map(function(g){
        var cardsHtml = g.items.map(function(r){
          var actionsHtml = r.status === "processing"
            ? '<div class="repair-actions">' +
                '<button type="button" class="repair-donebtn" data-done="'+escapeHtml(r.id)+'">✅ 처리 완료</button>' +
                '<button type="button" class="repair-rejectbtn" data-reject="'+escapeHtml(r.id)+'">🚫 처리 불가</button>' +
              '</div>'
            : '';
          return '<div class="archive-card" data-id="'+escapeHtml(r.id)+'">' +
            '<img src="'+escapeHtml(r.url)+'" alt="시설 보수 사진" loading="lazy">' +
            (isEditUnlocked() ? '<button type="button" class="delbtn" data-del="'+escapeHtml(r.id)+'" title="삭제">✕</button>' : '') +
            '<div class="meta">' +
              '<span class="badge '+escapeHtml(r.status)+'">'+escapeHtml(repairStatusLabel(r.status))+'</span>' +
              '<div class="loc">'+escapeHtml(r.location || "(장소 미기입)")+'</div>' +
              (r.note ? '<div class="dt">'+escapeHtml(r.note)+'</div>' : '') +
              actionsHtml +
            '</div>' +
          '</div>';
        }).join("");
        return '<div class="archive-date-group">' +
          '<div class="archive-date-heading">'+escapeHtml(formatArchiveDate(g.date))+'</div>' +
          '<div class="archive-grid">'+cardsHtml+'</div>' +
        '</div>';
      }).join("");
    }

    panel.innerHTML =
      '<h2>🛠️ 시설 보수 현황</h2>' +
      '<p class="desc">교직원이 휴대폰으로 보낸 시설 고장·보수 요청 사진입니다. <a href="sisul-bosu-jeonsong.html" target="_blank" rel="noopener">📱 시설 보수 현황 모바일 제보 페이지</a></p>' +
      '<div class="archive-toolbar">' + tabsHtml + '</div>' +
      '<div id="repairBody" style="margin-top:12px;">'+bodyHtml+'</div>';

    panel.querySelector("#repairStatusTabs").addEventListener("click", function(e){
      var btn = e.target.closest("button[data-f]");
      if (!btn) return;
      state.statusFilter = btn.getAttribute("data-f");
      paint();
    });

    Array.prototype.forEach.call(panel.querySelectorAll("[data-del]"), function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var id = btn.getAttribute("data-del");
        if (!isEditUnlocked()) { showEditLockModal(); return; }
        if (!confirm("이 요청을 삭제할까요? 되돌릴 수 없습니다.")) return;
        var target = null;
        for (var i=0;i<state.reports.length;i++){ if (state.reports[i].id === id){ target = state.reports[i]; break; } }
        if (target) removeRepairReport(target);
      });
    });

    Array.prototype.forEach.call(panel.querySelectorAll("[data-done]"), function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        if (!isEditUnlocked()) { showEditLockModal(); return; }
        updateRepairStatus(btn.getAttribute("data-done"), "done");
      });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-reject]"), function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        if (!isEditUnlocked()) { showEditLockModal(); return; }
        updateRepairStatus(btn.getAttribute("data-reject"), "rejected");
      });
    });

    Array.prototype.forEach.call(panel.querySelectorAll(".archive-card img"), function(img){
      img.addEventListener("click", function(){
        var card = img.closest(".archive-card");
        var id = card.getAttribute("data-id");
        var r = null;
        for (var i=0;i<state.reports.length;i++){ if (state.reports[i].id === id){ r = state.reports[i]; break; } }
        if (r) showRepairLightbox(r);
      });
    });
  }

  function showRepairLightbox(r){
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML =
      '<div class="modal-card" role="dialog" aria-modal="true" style="width:min(560px,100%);">' +
        '<img class="archive-lightbox-img" src="'+escapeHtml(r.url)+'" alt="시설 보수 사진">' +
        '<div><span class="badge '+escapeHtml(r.status)+'">'+escapeHtml(repairStatusLabel(r.status))+'</span></div>' +
        '<div class="loc" style="margin-top:8px;">'+escapeHtml(formatArchiveDate(r.date))+'</div>' +
        '<div class="dt">'+escapeHtml(r.location || "")+'</div>' +
        (r.note ? '<div class="desc" style="margin-top:8px;">'+escapeHtml(r.note)+'</div>' : '') +
        '<div class="modal-actions"><button type="button" id="repairLightboxClose">닫기</button></div>' +
      '</div>';
    document.body.appendChild(overlay);
    function close(){ overlay.remove(); }
    overlay.querySelector("#repairLightboxClose").addEventListener("click", close);
    overlay.addEventListener("mousedown", function(e){ if (e.target === overlay) close(); });
  }

  function updateRepairStatus(id, status){
    var idx = -1;
    for (var i=0;i<state.reports.length;i++){ if (state.reports[i].id === id){ idx = i; break; } }
    if (idx === -1) return;
    var oldEntry = state.reports[idx];
    var newEntry = {};
    for (var k in oldEntry) { if (Object.prototype.hasOwnProperty.call(oldEntry, k)) newEntry[k] = oldEntry[k]; }
    newEntry.status = status;
    newEntry.resolvedAt = new Date().toISOString();
    state.reports[idx] = newEntry;
    paint();
    if (db){
      var ref = repairDocRef();
      ref.update({ reports: firebase.firestore.FieldValue.arrayRemove(oldEntry) }).then(function(){
        return ref.update({ reports: firebase.firestore.FieldValue.arrayUnion(newEntry) });
      }).catch(function(){
        ref.set({ reports: state.reports }, { merge: true }).catch(function(){});
      });
    }
  }

  function removeRepairReport(entry){
    state.reports = state.reports.filter(function(r){ return r.id !== entry.id; });
    paint();
    if (db) repairDocRef().update({ reports: firebase.firestore.FieldValue.arrayRemove(entry) }).catch(function(){});
    if (assets && assets.remove) assets.remove(entry.id).catch(function(){});
  }

  paint();

  if (db) {
    var unsub = db.doc("sections/facility_repair").onSnapshot(function(snap){
      if (snap.exists) {
        var data = snap.data();
        if (data && Array.isArray(data.reports)) {
          state.reports = data.reports;
          markSynced();
          paint();
        }
      }
    }, function(){});
    unsubs.push(unsub);
  }
}

/* ---------------- sync indicator ---------------- */
function markSynced(){
  var dot = document.getElementById("syncDot"), txt = document.getElementById("syncText");
  if (!dot) return;
  dot.classList.add("on");
  txt.textContent = "실시간 동기화됨";
}

/* ---------------- clock ---------------- */
function tickClock(){
  var now = new Date();
  var h = String(now.getHours()).padStart(2,"0");
  var m = String(now.getMinutes()).padStart(2,"0");
  var clockTime = document.getElementById("clockTime");
  var clockDate = document.getElementById("clockDate");
  if (!clockTime || !clockDate) return;
  clockTime.textContent = h + ":" + m;
  var days = ["일","월","화","수","목","금","토"];
  clockDate.textContent = now.getFullYear()+"년 "+(now.getMonth()+1)+"월 "+now.getDate()+"일 ("+days[now.getDay()]+")";
}

/* ---------------- 라이트/다크 모드 전환 ---------------- */
var THEME_KEY = "ojeong_theme";
function effectiveTheme(){
  var attr = document.documentElement.getAttribute("data-theme");
  if (attr === "light" || attr === "dark") return attr;
  try {
    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
  } catch(e){}
  return "light";
}
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch(e){}
  paintThemeBtn();
}
function paintThemeBtn(){
  var btn = document.getElementById("themeToggleBtn");
  if (!btn) return;
  var cur = effectiveTheme();
  btn.textContent = cur === "dark" ? "☀️" : "🌙";
  btn.title = cur === "dark" ? "라이트 모드로 전환" : "다크 모드로 전환";
}
function initThemeToggle(){
  var btn = document.getElementById("themeToggleBtn");
  if (!btn) return;
  paintThemeBtn();
  btn.addEventListener("click", function(){
    applyTheme(effectiveTheme() === "dark" ? "light" : "dark");
  });
}

   아래 firebaseConfig 값을 본인의 Firebase 프로젝트 값으로 반드시 교체하세요.
   Firebase 콘솔 > 프로젝트 설정(톱니바퀴) > 일반 탭 > 내 앱(웹 앱)에서 그대로 복사하면 됩니다.

/* db/assets 어댑터: 기존 Claude 아티팩트의 db/assets 기능과 거의 같은 모양(doc().set/update/onSnapshot,
   assets.upload)으로 감싸서, 위의 모든 render*Section 함수를 그대로 재사용할 수 있게 합니다. */
function makeDbAdapter(firestoreDb){
  return {
    doc: function(path){
      var parts = path.split("/");
      var ref = firestoreDb.collection(parts[0]).doc(parts[1]);
      return {
        set: function(data){ return ref.set(data); },
        update: function(data){ return ref.update(data); },
        onSnapshot: function(onNext, onError){
          return ref.onSnapshot(function(snap){
            onNext({ exists: snap.exists, data: function(){ return snap.data(); } });
          }, onError || function(){});
        }
      };
    }
  };
}

function makeAssetsAdapter(storageInstance){
  return {
    upload: function(file){
      var safeName = (file.name || "image").replace(/[^a-zA-Z0-9._-]/g, "_");
      var id = Date.now() + "_" + Math.random().toString(36).slice(2) + "_" + safeName;
      var ref = storageInstance.ref().child("uploads/" + id);
      return ref.put(file).then(function(snap){
        return snap.ref.getDownloadURL().then(function(url){
          return { id: id, url: url, sizeBytes: file.size, contentType: file.type };
        });
      });
    },
    remove: function(id){
      return storageInstance.ref().child("uploads/" + id).delete();
    }
  };
}

  try {
    firebase.initializeApp(firebaseConfig);
  } catch(e){
    if (syncTxt) syncTxt.textContent = "Firebase 연결 실패";
    if (banner) banner.classList.add("show");
    return;
  }

  firebase.auth().signInAnonymously().then(function(){
    db = makeDbAdapter(firebase.firestore());
    assets = makeAssetsAdapter(firebase.storage());
    buildPanels(); // db가 준비됐으니 실시간 구독을 붙여서 다시 그림
  }).catch(function(err){
    if (syncTxt) syncTxt.textContent = "연결 대기 중 (오프라인 모드)";
    if (banner) banner.classList.add("show");
    console.error("Firebase 익명 로그인 실패:", err);
  });
})();

})();
